# Deploy: Render Dashboard → New → Blueprint → select Dhrumit26/resumebuilder
# Free web service sleeps after ~15 min idle (first request after sleep is slow).
#
# After deploy: set OPENAI_API_KEY in Render Dashboard → Environment
# (sync: false means it is not stored in this file).

services:
  - type: web
    name: resumebuilder
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: SCORE_THRESHOLD
        value: "90"
      # 92 = the rubric's reachable ceiling once the anti-AI penalty applies.
      # 95 was unsatisfiable, so the fix loop never exited early.
      - key: TARGET_SCORE
        value: "92"
      - key: MAX_REMAKE_ATTEMPTS
        value: "4"
      - key: BEST_OF_N
        value: "2"
      - key: SCORE_SAMPLES
        value: "2"
      - key: OPENAI_API_KEY
        sync: false
