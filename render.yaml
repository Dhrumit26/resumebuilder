# Deploy: Render Dashboard → New → Blueprint → select Dhrumit26/resumebuilder
# Free web service sleeps after ~15 min idle (first request after sleep is slow).

services:
  - type: web
    name: resumebuilder
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: grok
      - key: GROK_MODEL
        value: grok-4.5
      - key: GROK_WRITER_MODEL
        value: grok-4.5
      - key: GROK_JUDGE_MODEL
        value: grok-4.20-0309-non-reasoning
      - key: SCORE_THRESHOLD
        value: "90"
      - key: TARGET_SCORE
        value: "95"
      - key: MAX_REMAKE_ATTEMPTS
        value: "4"
      - key: BEST_OF_N
        value: "2"
      - key: SCORE_SAMPLES
        value: "2"
      - key: GROK_API_KEY
        sync: false
