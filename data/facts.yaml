# =============================================================================
# FACT BANK — the only source of truth for what may appear on the resume.
# =============================================================================
#
# Every bullet the builder writes must trace back to a fact in this file.
# The writer agents may CHOOSE facts, ORDER them, and REPHRASE them in the job
# description's vocabulary. They may never invent a system, a tool, or a number.
#
# CLERXI-SPECIFIC TAILORING MODE
#   For role id `clerxi`, tailor aggressively toward the job description while
#   remaining fully truthful. The writer may select, reorder, compress, combine,
#   and reframe confirmed Clerxi facts using the JD's vocabulary.
#
#   The writer may NOT invent work, tools, systems, ownership, scope, or metrics.
#   When the JD calls for experience not represented by a confirmed fact, do not
#   put it on the resume. Instead, return a separate verification question such
#   as: "Did you do X at Clerxi? If yes, describe it and any measurable result."
#   A suggested fact becomes usable only after the candidate confirms it and it
#   is added to this fact bank.
#
# HOW TAILORING WORKS
#   The LaTeX templates in latex/ fix the layout and the bullet count
#   (Clerxi 5, Intuit 5, each project 2). Tailoring therefore happens by:
#     1. SELECTION  — which real facts fill those slots (needs more facts than
#                     slots to have any choice — see "ADDING FACTS" below)
#     2. ORDER      — the fact that matches the JD best goes first
#     3. FRAMING    — the same fact described at the abstraction level and in
#                     the vocabulary the JD cares about, without changing what
#                     actually happened
#
# ADDING FACTS  <-- read this
#   Right now each role has exactly as many facts as it has bullet slots, so
#   every fact is always used and only order and framing change. The more REAL
#   facts you add here, the more genuinely the resume can flex toward a job.
#   Small things count and are worth adding: a UI you touched, a script you
#   wrote, a dashboard, a migration, a bug class you fixed, a doc you owned,
#   an on-call save, a code review practice. If you did frontend work at
#   Clerxi, add it — that is what lets a frontend JD pull real frontend
#   bullets out of your current role instead of backend ones reworded.
#
# FIELDS
#   core     (required) What actually happened, in plain words. The immutable
#            fact. Writers rephrase this; they never add to it.
#   tools    Technologies genuinely used for THIS fact. A writer may not name
#            a tool in a bullet unless it is listed on that bullet's fact.
#   themes   Engineering themes, used by code to match facts to a JD.
#            Vocabulary: see THEMES in src/facts.py.
#   metrics  Every number that may appear in a bullet from this fact, written
#            exactly. A number not listed here is rejected as fabricated.
#   frozen   Tool pairings that must survive rewording verbatim
#            (e.g. "Cypress to Playwright" — never becomes "Python to Playwright").
#   angles   Optional. Truthful alternative framings of the same work, for JDs
#            in a different domain. These are angles, not new claims.
# =============================================================================

